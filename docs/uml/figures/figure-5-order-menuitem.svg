<text x="663" y="440" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#111827">Note: Order does not keep a reference to</text>
<text x="663" y="465" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#111827">MenuItem. placeOrder() copies the item’s</text>
<text x="663" y="490" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#111827">name into itemName and stores</text>
<text x="663" y="515" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#111827">totalAmount = price × quantity, so</text>
<text x="663" y="540" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#111827">there is no line between the two classes.</text>
